{% now "Y" as year %}
<footer class="site-footer">
  <div class="container site-footer__inner">
    <p class="site-footer__copy">© {{ year }} {{ profile.full_name|default:"" }}<span class="mono muted"> · Built with Django</span></p>
    <ul class="site-footer__links">
      <li><a href="{% url 'projects:list' %}">Projects</a></li>
      <li><a href="{% url 'core:resume' %}">Resume</a></li>
      <li><a href="{% url 'contact:contact' %}">Contact</a></li>
      {% if profile.github_url %}<li><a href="{{ profile.github_url }}" target="_blank" rel="noopener noreferrer">GitHub</a></li>{% endif %}
      {% if profile.linkedin_url %}<li><a href="{{ profile.linkedin_url }}" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>{% endif %}
    </ul>
  </div>
</footer>
